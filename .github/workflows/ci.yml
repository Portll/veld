name: CI

on:
  push:
    branches: [main]
    # Release tags get the release build on all three platforms (see the build job).
    tags: ['v*']
  pull_request:
    branches: [main]
  # Run the full macOS + Windows + Linux build on demand.
  workflow_dispatch:

# A newer push to the same ref cancels the run it supersedes: only the latest commit's result matters,
# and on a private repository every superseded minute is billed.
concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  version-check:
    name: Version Consistency
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check version consistency across packages
        run: |
          # Extract versions from all package files
          CARGO_VERSION=$(grep '^version = ' Cargo.toml | head -1 | sed 's/version = "\(.*\)"/\1/')
          NPM_VERSION=$(grep '"version"' mcp-server/package.json | head -1 | sed 's/.*"version": "\(.*\)".*/\1/')
          PYPI_VERSION=$(grep '^version = ' pyproject.toml | head -1 | sed 's/version = "\(.*\)"/\1/')
          normalize_core() {
            python3 -c 'import re, sys; v = sys.argv[1].strip(); m = re.match(r"^(\d+\.\d+\.\d+)", v); print(m.group(1) if m else v)' "$1"
          }
          CARGO_CORE=$(normalize_core "$CARGO_VERSION")
          NPM_CORE=$(normalize_core "$NPM_VERSION")
          PYPI_CORE=$(normalize_core "$PYPI_VERSION")

          echo "Cargo.toml version: $CARGO_VERSION"
          echo "package.json version: $NPM_VERSION"
          echo "pyproject.toml version: $PYPI_VERSION"
          echo "Normalized Cargo core: $CARGO_CORE"
          echo "Normalized npm core: $NPM_CORE"
          echo "Normalized PyPI core: $PYPI_CORE"

          # Check all normalized release cores match. This allows branch-local
          # prerelease markers like Cargo/npm `-unstable` and PyPI `.dev0`.
          if [ "$CARGO_CORE" != "$NPM_CORE" ] || [ "$CARGO_CORE" != "$PYPI_CORE" ]; then
            echo "::error::Version core mismatch detected!"
            echo "  Cargo.toml:     $CARGO_VERSION ($CARGO_CORE)"
            echo "  package.json:   $NPM_VERSION ($NPM_CORE)"
            echo "  pyproject.toml: $PYPI_VERSION ($PYPI_CORE)"
            exit 1
          fi

          echo "✓ All normalized version cores match: $CARGO_CORE"
          echo "### Version Check" >> $GITHUB_STEP_SUMMARY
          echo "Normalized package version core: **$CARGO_CORE**" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Package | Raw Version |" >> $GITHUB_STEP_SUMMARY
          echo "|---------|-------------|" >> $GITHUB_STEP_SUMMARY
          echo "| Cargo | $CARGO_VERSION |" >> $GITHUB_STEP_SUMMARY
          echo "| npm | $NPM_VERSION |" >> $GITHUB_STEP_SUMMARY
          echo "| PyPI | $PYPI_VERSION |" >> $GITHUB_STEP_SUMMARY

  upstream-ledger:
    name: Upstream Ledger
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          # The check resolves every veld commit the ledger names.
          fetch-depth: 0
      - name: Check docs/upstream/LEDGER.tsv
        run: python3 scripts/upstream/ledger.py check
      - name: The upstream watcher succeeded within 48 hours
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/upstream/ledger.py heartbeat

  format:
    name: Format Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Check formatting
        run: cargo fmt --all -- --check

  clippy:
    name: Clippy Analysis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Install LLVM
        run: |
          sudo apt-get update
          sudo apt-get install -y llvm-dev libclang-dev clang
      - name: Run Clippy
        run: |
          set -o pipefail
          # clippy::all stays at -W while its style and complexity lints are cleared. The correctness
          # group is denied: -W clippy::all would downgrade those deny-by-default lints, which flag
          # code that is almost certainly wrong, such as an assert that can never fail. The -D comes
          # after the -W so it wins for that group.
          cargo clippy --all-targets -- -W clippy::all -D clippy::correctness 2>&1 | tee clippy-output.txt
          cargo clippy --all-targets --no-default-features --features storage-redb -- -W clippy::all -D clippy::correctness 2>&1 | tee -a clippy-output.txt
          WARNINGS=$(grep -c "warning:" clippy-output.txt || true)
          echo "### Clippy Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Metric | Count |" >> $GITHUB_STEP_SUMMARY
          echo "|--------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Warnings | $WARNINGS |" >> $GITHUB_STEP_SUMMARY
          echo "| Status | Passed |" >> $GITHUB_STEP_SUMMARY

  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    # The release build runs on release tags (v*) and manual dispatch only, on all three platforms.
    # Measured 2026-09-18 over 35 days: the macOS runs billed ~1,870 minutes (x10 rate) and the
    # Windows runs ~734 (x2), 2,604 of the ~4,100 that exhausted the account's Actions budget; those
    # moved to tags and dispatch on 2026-09-17. Measured 2026-09-27 over 30 days: the Linux release
    # build that stayed on every push averaged 14.6 min a run, 366 minutes, beside a 15.3 min debug
    # compile in `test` that already proves the tree builds on Linux. Release-profile breakage is
    # caught at release or on demand (Actions > CI > Run workflow).
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Install LLVM (Ubuntu)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y llvm-dev libclang-dev clang

      - name: Install LLVM (macOS)
        if: matrix.os == 'macos-latest'
        run: |
          brew install llvm
          LLVM_PREFIX=$(brew --prefix llvm)
          echo "LLVM_CONFIG_PATH=$LLVM_PREFIX/bin/llvm-config" >> $GITHUB_ENV
          echo "LIBCLANG_PATH=$LLVM_PREFIX/lib" >> $GITHUB_ENV
          echo "DYLD_FALLBACK_LIBRARY_PATH=$LLVM_PREFIX/lib${DYLD_FALLBACK_LIBRARY_PATH:+:$DYLD_FALLBACK_LIBRARY_PATH}" >> $GITHUB_ENV

      - name: Set LIBCLANG_PATH (Windows)
        if: matrix.os == 'windows-latest'
        run: echo "LIBCLANG_PATH=C:\Program Files\LLVM\bin" >> $env:GITHUB_ENV

      - name: Build Release
        run: cargo build --release

      - name: Display build info (Unix)
        if: matrix.os != 'windows-latest'
        run: |
          VELD_SIZE=$(ls -lh target/release/veld 2>/dev/null | awk '{print $5}' || echo "N/A")
          MEERKAT_SIZE=$(ls -lh target/release/meerkat 2>/dev/null | awk '{print $5}' || echo "N/A")
          echo "### Build Results (${{ matrix.os }})" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Binary | Size |" >> $GITHUB_STEP_SUMMARY
          echo "|--------|------|" >> $GITHUB_STEP_SUMMARY
          echo "| veld | $VELD_SIZE |" >> $GITHUB_STEP_SUMMARY
          echo "| meerkat | $MEERKAT_SIZE |" >> $GITHUB_STEP_SUMMARY

      - name: Display build info (Windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          $veld = Get-Item target/release/veld.exe -ErrorAction SilentlyContinue
          $meerkat = Get-Item target/release/meerkat.exe -ErrorAction SilentlyContinue
          $veldSize = if ($veld) { "{0:N2} MB" -f ($veld.Length / 1MB) } else { "N/A" }
          $meerkatSize = if ($meerkat) { "{0:N2} MB" -f ($meerkat.Length / 1MB) } else { "N/A" }
          "### Build Results (${{ matrix.os }})" | Out-File -Append -FilePath $env:GITHUB_STEP_SUMMARY
          "" | Out-File -Append -FilePath $env:GITHUB_STEP_SUMMARY
          "| Binary | Size |" | Out-File -Append -FilePath $env:GITHUB_STEP_SUMMARY
          "|--------|------|" | Out-File -Append -FilePath $env:GITHUB_STEP_SUMMARY
          "| veld.exe | $veldSize |" | Out-File -Append -FilePath $env:GITHUB_STEP_SUMMARY
          "| meerkat.exe | $meerkatSize |" | Out-File -Append -FilePath $env:GITHUB_STEP_SUMMARY

      - name: Upload binary (Linux)
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v4
        with:
          name: veld-linux
          path: |
            target/release/veld
            target/release/meerkat
          if-no-files-found: ignore

      - name: Upload binary (macOS)
        if: matrix.os == 'macos-latest'
        uses: actions/upload-artifact@v4
        with:
          name: veld-macos
          path: |
            target/release/veld
            target/release/meerkat
          if-no-files-found: ignore

      - name: Upload binary (Windows)
        if: matrix.os == 'windows-latest'
        uses: actions/upload-artifact@v4
        with:
          name: veld-windows
          path: |
            target/release/veld.exe
            target/release/meerkat.exe
          if-no-files-found: ignore

  test:
    name: Tests (${{ matrix.engines }})
    runs-on: ubuntu-latest
    # One job per engine set, so a red RocksDB-and-redb run cannot hide whether either engine alone
    # still builds and passes: the second set used to run only if the first came back green. The
    # default build carries both engines; the redb-only and rocksdb-only builds keep each engine
    # from leaning on the other (a redb reference in a RocksDB-only test path once broke the
    # rocksdb-only build without any job noticing). Each runs
    # the library tests (including the engine differential harness in src/storage/), every
    # integration test in tests/ (backup_restore_parity, migrate_round_trip, recall_engine_parity,
    # engine_refusal_ratchet), and compiles every bench so a bench cannot rot unbuilt.
    # The encrypted-tenant tests set and clear VELD_MASTER_PASSPHRASE themselves, in their own
    # binaries; a job-level value would leak into tests that assert it is absent.
    strategy:
      fail-fast: false
      matrix:
        include:
          - engines: rocksdb-and-redb
            cargo_features: ''
          - engines: redb-only
            cargo_features: '--no-default-features --features storage-redb'
          - engines: rocksdb-only
            cargo_features: '--no-default-features --features rocksdb'
    # Runs on every push, pull request, tag and dispatch. From 2026-09-27 to 2026-10-11 it ran on
    # tags and dispatch only, because the account's Actions budget ran out twice in September and
    # the suite needs ~20 runner minutes; the repository went public on 2026-10-11 and standard
    # Linux runners are free there, so the reason is gone. Two tests left red on main in that
    # window (#49). Local method, which reproduced this job's results exactly: an empty HOME (so
    # the model cache is empty, as on a runner), CARGO_PROFILE_*_DEBUG=0 and a private
    # CARGO_TARGET_DIR; run A without the model matched this job's 216 failures one for one, run B
    # after model-fetch passed 2,345 of 2,345.
    # No debug info in test builds. On 2026-09-27 the runner ran out of disk linking
    # hebbian_learning_tests (ld SIGBUS, "No space left on device"): every integration test is its
    # own binary carrying full DWARF for the crate, RocksDB and ONNX Runtime. Panic messages keep
    # their file:line without it; the cc-built C++ objects drop -g as well.
    env:
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_PROFILE_TEST_DEBUG: 0
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: tests-${{ matrix.engines }}

      - name: Install LLVM
        run: |
          sudo apt-get update
          sudo apt-get install -y llvm-dev libclang-dev clang

      # The ONNX runtime and MiniLM. Without them every test that builds a memory system fails
      # (216 of them on 2026-09-27: ort is load-dynamic and the runner has neither). Fetched by
      # veld's own downloader, pinned and SHA-256 verified, into the cache the tests search, and
      # cached by the file that pins them.
      - uses: actions/cache@v4
        id: models
        with:
          path: ~/.cache/veld
          key: veld-models-${{ runner.os }}-${{ hashFiles('src/embeddings/downloader.rs', 'src/embeddings/cross_encoder.rs') }}
      - name: Fetch the ONNX runtime, MiniLM and the reranker
        if: steps.models.outputs.cache-hit != 'true'
        run: cargo run --quiet --bin model-fetch -- --onnxruntime --minilm --cross-encoder

      - name: Run all tests
        # pipefail: without it the step's status is tee's, and neither a failing test nor a compile
        # error could fail this job.
        run: |
          set -o pipefail
          cargo test --no-fail-fast ${{ matrix.cargo_features }} 2>&1 | tee test-output.txt

      # Compile-only: benches are timing harnesses, but a bench that no longer builds goes unnoticed
      # until someone wants a number. Covers storage_engine_benchmarks and cold_start_benchmarks
      # along with the rest of the [[bench]] targets in Cargo.toml.
      - name: Build the benches (no run)
        run: cargo bench --no-run ${{ matrix.cargo_features }}

      - name: Generate test summary
        if: always()
        run: |
          # Summed over every test binary; `tail -1` reported only the last one.
          count() { grep -oE "[0-9]+ $1;" test-output.txt | awk '{s+=$1} END {print s+0}'; }
          PASSED=$(count passed)
          FAILED=$(count failed)
          IGNORED=$(count ignored)

          echo "## Test Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Status | Count |" >> $GITHUB_STEP_SUMMARY
          echo "|--------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Passed | $PASSED |" >> $GITHUB_STEP_SUMMARY
          echo "| Failed | $FAILED |" >> $GITHUB_STEP_SUMMARY
          echo "| Ignored | $IGNORED |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          if [ "$FAILED" != "0" ]; then
            echo "### Failed Tests" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            grep -A 5 "FAILED" test-output.txt >> $GITHUB_STEP_SUMMARY || true
            echo '```' >> $GITHUB_STEP_SUMMARY
          fi

  summary:
    name: CI Summary
    runs-on: ubuntu-latest
    needs: [version-check, format, clippy, build, test]
    if: always()
    steps:
      - name: Generate final summary
        run: |
          echo "# CI Pipeline Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Check | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|--------|" >> $GITHUB_STEP_SUMMARY

          version_icon="${{ needs.version-check.result == 'success' && '✅' || '❌' }}"
          format_icon="${{ needs.format.result == 'success' && '✅' || '❌' }}"
          clippy_icon="${{ needs.clippy.result == 'success' && '✅' || '❌' }}"
          # A skipped build passes only where the policy skips it: a push or PR that is not a release
          # tag. On a tag or a dispatch the build must run, and a skip there is a failure.
          build_expected="${{ github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v') }}"
          build_result="${{ needs.build.result }}"
          if [[ "$build_result" == "success" || ( "$build_result" == "skipped" && "$build_expected" == "false" ) ]]; then build_ok=true; else build_ok=false; fi
          if [[ "$build_result" == "skipped" && "$build_ok" == "true" ]]; then build_icon="⏭"; elif [[ "$build_ok" == "true" ]]; then build_icon="✅"; else build_icon="❌"; fi
          # Tests run on every event, so only success passes; a skip is a failure.
          test_result="${{ needs.test.result }}"
          if [[ "$test_result" == "success" ]]; then test_ok=true; else test_ok=false; fi
          if [[ "$test_ok" == "true" ]]; then test_icon="✅"; else test_icon="❌"; fi

          echo "| Version | $version_icon ${{ needs.version-check.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Format | $format_icon ${{ needs.format.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Clippy | $clippy_icon ${{ needs.clippy.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Build | $build_icon $build_result$([[ "$build_icon" == "⏭" ]] && echo ' (release tags and dispatch only)') |" >> $GITHUB_STEP_SUMMARY
          echo "| Tests | $test_icon $test_result |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          if [[ "${{ needs.version-check.result }}" == "success" && \
                "${{ needs.format.result }}" == "success" && \
                "${{ needs.clippy.result }}" == "success" && \
                "$build_ok" == "true" && \
                "$test_ok" == "true" ]]; then
            echo "### All critical checks passed" >> $GITHUB_STEP_SUMMARY
            exit 0
          else
            echo "### Some checks failed" >> $GITHUB_STEP_SUMMARY
            exit 1
          fi
