name: Recall Gate

# Measures retrieval quality on the 100-case LoCoMo gate with `recall-eval`, once per storage engine.
# Each engine's run is gated against tests/recall/locomo-gate-baseline.json, and the two engines'
# scores must be equal. It gates every pull request that touches a path that can move a ranking,
# runs weekly, and runs on dispatch for the other suites, recordings and arms.

on:
  pull_request:
    branches: [main]
    # What the gate measures: the retrieval pipeline and what it is built from, the harness and
    # its fixtures, the scripts that read its reports, and the dependency lock (an ONNX Runtime
    # or tantivy upgrade moves rankings). Pull requests change none of the dispatch inputs, so
    # they always run the gated locomo-gate suite at layer full with the shipped dials.
    paths:
      - 'src/memory/**'
      - 'src/embeddings/**'
      - 'src/vector_db/**'
      - 'src/graph_memory.rs'
      - 'src/constants.rs'
      - 'src/handlers/remember.rs'
      - 'src/recall_harness/**'
      - 'src/bin/recall_eval.rs'
      - 'tests/recall/**'
      - 'scripts/recall_*.py'
      - 'scripts/stage_diff.py'
      - 'Cargo.lock'
      - '.github/workflows/recall.yml'
  schedule:
    - cron: '17 3 * * 1'
  workflow_dispatch:
    inputs:
      tolerance:
        description: 'Allowed regression in percent of baseline'
        required: false
        default: '2.0'
      repeats:
        description: 'Ingest+query repeats'
        required: false
        default: '5'
      layer:
        description: 'Layer attribution: full (gated) or all (every cumulative rung, for diagnosis)'
        required: false
        default: 'full'
        type: choice
        options: ['full', 'all']
      suite:
        description: >-
          locomo-gate is the 100-case gate. locomo is all 1,531 LoCoMo cases, for a question the
          gate is too coarse to settle: whole-case metrics move in steps of 1/n, 0.01 overall and
          0.04 on multi_hop at n=100, both above a 2% allowance. locomo contains the gate's
          conversation; locomo-holdout leaves it out, and every case someone has examined, and
          is the number to report. directional asks who did what to whom over role-swapped twin
          memories made of the same words (chance is 50% p@1). None but the gate is gated.
        required: false
        default: 'locomo-gate'
        type: choice
        options: ['locomo-gate', 'locomo', 'locomo-holdout', 'directional']
      stage_export:
        description: >-
          Write every pipeline stage (embedding hashes, NER spans, graph nodes and edges, each
          stage's ranking and scores, the cross-encoder's scores over its pool) to
          stages-<engine>.jsonl in the report artifact. scripts/stage_diff.py compares two such
          files; see tests/recall/README.md.
        required: false
        default: 'off'
        type: choice
        options: ['off', 'on']
      record:
        description: 'Record a new baseline: run ungated and upload the reports'
        required: false
        default: 'false'
        type: choice
        options: ['false', 'true']
      model_tape:
        description: >-
          Model tape (src/embeddings/model_tape.rs). pinned replays the tape named in
          tests/recall/model-tape.json, as the schedule does, so no model arithmetic happens and
          the result cannot depend on the CPU; with no pin file the models run live. record runs
          the models and uploads every output they gave as the model-tape-<engine> artifact.
          replay answers every model call from the RocksDB tape of run tape_run. off runs the
          models live.
        required: false
        default: 'pinned'
        type: choice
        options: ['pinned', 'off', 'record', 'replay']
      tape_run:
        description: 'Run id whose model-tape-rocksdb artifact to replay (model_tape=replay only)'
        required: false
        default: ''
      rerank_model:
        description: >-
          Cross-encoder registry id for the rerank_model dial (src/embeddings/cross_encoder.rs);
          empty keeps the shipped default. The baseline was recorded under mxbai-rerank-xsmall-v1,
          so another model is another pipeline: the gate refuses the comparison, so pair this
          with record=true and read the diff table as a comparison, not a gate.
        required: false
        default: ''
      rerank_count:
        description: >-
          Cross-encoder budget for the rerank_count dial; empty keeps the shipped default (20).
          As with rerank_model, a different cap is not gated: pair it with record=true.
        required: false
        default: ''
      rerank_pool:
        description: >-
          Fused candidates kept for the cross-encoder (rerank_pool dial); empty keeps the shipped
          30, or 50 for a decomposed query. Not gated: pair it with record=true.
        required: false
        default: ''
      ce_blend:
        description: >-
          Cross-encoder share of the final blend for every query shape (ce_blend dial, 0..1);
          empty keeps each shape's own share. Not gated: pair it with record=true.
        required: false
        default: ''
      relative_priors:
        description: >-
          'true' turns on the relative_priors dial: Layer 5 divides the fused base by the best
          base and scales it by 1 + priors instead of adding them. Empty keeps the additive form.
          The report records it, so the gate refuses the baseline: dispatch a control and this
          arm with record=true on the same ref and compare them with scripts/recall_diff.py.
        required: false
        default: ''
      graph_episode_entities:
        description: >-
          Cap on how many graph-reached entities have their episodes read (graph_episode_entities
          dial, highest decay factor first). Empty reads every reached entity's episodes. Recorded
          like relative_priors: pair it with record=true and a control run.
        required: false
        default: ''
      embedder:
        description: >-
          Primary embedder. minilm-l6-v2 is what the baseline measures. arctic-embed-xs
          (snowflake-arctic-embed-xs, CLS-pooled, query prefix) and nomic-embed-text-v1.5 (the
          in-process ONNX build of the model a live server reaches over HTTP, with its task
          prefixes) are alternative arms: recall-eval refuses to gate across embedders, so dispatch
          them with record=true.
        required: false
        default: 'minilm-l6-v2'
        type: choice
        options: ['minilm-l6-v2', 'arctic-embed-xs', 'nomic-embed-text-v1.5']

permissions:
  contents: read
  # model_tape=replay downloads another run's artifact.
  actions: read

# A dispatched run is a deliberate measurement and is never redundant with another, so it gets a
# group of its own: a second arm dispatched on the same branch must not cancel the first. A push to
# a pull request supersedes that pull request's run, and a scheduled run the one before it.
concurrency:
  group: recall-${{ github.ref }}-${{ github.event_name == 'workflow_dispatch' && github.run_id || 'auto' }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_PROFILE_RELEASE_DEBUG: 0
  TOLERANCE: ${{ github.event.inputs.tolerance || '2.0' }}
  REPEATS: ${{ github.event.inputs.repeats || '5' }}
  # Pull requests and the schedule always run the gated `full` rung; only a dispatch widens to
  # every rung. The gate reads `full` alone, so `all` still gates.
  LAYER: ${{ github.event.inputs.layer || 'full' }}
  # Pull requests and the schedule run the gate suite; only a dispatch reaches the other suites,
  # which have no baseline and are never gated.
  SUITE: ${{ github.event.inputs.suite || 'locomo-gate' }}
  RECORD: ${{ github.event.inputs.record || 'false' }}
  # Pull requests and the schedule replay the pinned tape, the same model outputs on every runner,
  # once tests/recall/model-tape.json exists. Until then their models run live, and the kernel
  # class check below is what keeps two runners' arithmetic apart.
  MODEL_TAPE: ${{ github.event.inputs.model_tape || 'pinned' }}
  # The report's `embedder` field names what produced it. VELD_EMBEDDER selects it explicitly in
  # the eval step, so an arm never reaches its embedder through the fallback order.
  EMBEDDER: ${{ github.event.inputs.embedder || 'minilm-l6-v2' }}

jobs:
  gate:
    name: Recall gate (${{ matrix.engine }})
    runs-on: ubuntu-latest
    # A recording runs every model live on every call, then scores the rest of the 100 x 629
    # cross-encoder table, so it gets longer. The full and held-out suites (5,882 and 5,253
    # turns, over a thousand questions each, reranked) get the job maximum: upstream's runs of
    # the full suite were cancelled at 60 minutes.
    timeout-minutes: ${{ (github.event.inputs.suite == 'locomo' || github.event.inputs.suite == 'locomo-holdout') && 360 || github.event.inputs.model_tape == 'record' && 180 || 90 }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - engine: rocksdb
            features: ''
          - engine: redb
            features: '--no-default-features --features storage-redb'
    steps:
      - uses: actions/checkout@v4

      - name: Cache the pinned model tape
        if: env.MODEL_TAPE == 'pinned' && hashFiles('tests/recall/model-tape.json') != ''
        uses: actions/cache@v4
        with:
          path: model-tape
          key: model-tape-${{ hashFiles('tests/recall/model-tape.json') }}

      # Decides where this run's model outputs come from and exports TAPE_PATH (empty: the models
      # run live). A pinned tape is checked against its pinned sha256; recall-eval records the same
      # digest in its report, and compare_to_baseline refuses two reports whose model outputs came
      # from different places.
      - name: Resolve the model tape
        env:
          GH_TOKEN: ${{ github.token }}
          TAPE_RUN: ${{ github.event.inputs.tape_run }}
        run: |
          set -euo pipefail
          TAPE_PATH=""
          case "$MODEL_TAPE" in
            pinned)
              PIN=tests/recall/model-tape.json
              if [ -f "$PIN" ]; then
                TAG=$(jq -r '.tag' "$PIN")
                ASSET=$(jq -r '.asset' "$PIN")
                SHA=$(jq -r '.sha256' "$PIN")
                mkdir -p model-tape
                if [ ! -f "model-tape/$ASSET" ]; then
                  gh release download "$TAG" --repo "$GITHUB_REPOSITORY" -p "$ASSET" -D model-tape
                fi
                echo "$SHA  model-tape/$ASSET" | sha256sum -c - || {
                  echo "::error::model-tape/$ASSET does not match the sha256 pinned in $PIN."
                  exit 1
                }
                TAPE_PATH="model-tape/$ASSET"
              else
                echo "::notice::No pinned model tape ($PIN), so the models run live."
              fi
              ;;
            replay)
              if [ -z "$TAPE_RUN" ]; then
                echo "::error::model_tape=replay needs tape_run, the id of a run that recorded one."
                exit 1
              fi
              gh run download "$TAPE_RUN" --repo "$GITHUB_REPOSITORY" -n model-tape-rocksdb -D model-tape
              TAPE_PATH="model-tape/model-tape-rocksdb.jsonl.gz"
              ;;
            record|off) ;;
            *)
              echo "::error::unknown model_tape value '$MODEL_TAPE'"
              exit 1
              ;;
          esac
          echo "Model tape: mode=$MODEL_TAPE path=${TAPE_PATH:-<none, models run live>}"
          echo "TAPE_PATH=$TAPE_PATH" >> "$GITHUB_ENV"

      # ONNX Runtime picks its kernels by CPUID, so identical code ranks differently on runners
      # that expose different CPU features (`KernelClass` in src/recall_harness/report.rs).
      # recall-eval refuses a cross-class comparison as infrastructure, but only after the build
      # and the run; this applies the same rule from /proc/cpuinfo so a gated run on the wrong
      # class fails in seconds. recall-eval stays the authority. A dispatch is not stopped: a
      # recording has to be able to measure on any class. A replayed tape ran no model
      # arithmetic, so the class does not matter. A baseline that records no class is compared,
      # and says so.
      - name: Check the runner's CPU kernel class
        run: |
          flags=" $(grep -m1 '^flags' /proc/cpuinfo | cut -d: -f2) "
          has() { [[ "$flags" == *" $1 "* ]]; }
          if has avx512f; then RUNNER_CLASS=x86_64-avx512f
          elif has avx2 && has fma; then RUNNER_CLASS=x86_64-avx2-fma
          elif has avx; then RUNNER_CLASS=x86_64-avx
          else RUNNER_CLASS=x86_64-sse
          fi
          # KERNEL_CLASS_EXTRAS in report.rs, in its order, as "<cpuinfo flag>:<class suffix>".
          # The step after the eval fails the job if this name and recall-eval's disagree.
          for pair in avx512bw:avx512bw avx512dq:avx512dq avx512vl:avx512vl \
                      avx512_vnni:avx512vnni avx512_bf16:avx512bf16 avx512_fp16:avx512fp16 \
                      avx_vnni:avxvnni amx_tile:amx-tile amx_int8:amx-int8 amx_bf16:amx-bf16; do
            if has "${pair%%:*}"; then RUNNER_CLASS="$RUNNER_CLASS+${pair#*:}"; fi
          done
          echo "RUNNER_CLASS=$RUNNER_CLASS" >> "$GITHUB_ENV"
          CPU_MODEL=$(grep -m1 '^model name' /proc/cpuinfo | cut -d: -f2 | sed 's/^ *//')
          BASELINE_CLASS=$(jq -r '.kernel.class // ""' tests/recall/locomo-gate-baseline.json)
          echo "Runner: class=$RUNNER_CLASS cpu=$CPU_MODEL; baseline class=${BASELINE_CLASS:-<not recorded>}"
          if [ -n "$TAPE_PATH" ]; then
            echo "Replaying a model tape: this runner's CPU class does not affect the result."
          elif [ "$GITHUB_EVENT_NAME" != "workflow_dispatch" ] && [ "$SUITE" = "locomo-gate" ] && [ "$RECORD" != "true" ]; then
            if [ -z "$BASELINE_CLASS" ]; then
              echo "::warning::The gate baseline records no CPU kernel class, so this run on $RUNNER_CLASS ($CPU_MODEL) is compared on trust: a case that moved may have moved because of the runner. Record the baseline again (tests/recall/README.md)."
            elif [ "$RUNNER_CLASS" != "$BASELINE_CLASS" ]; then
              echo "::error::This runner's CPU kernel class is $RUNNER_CLASS ($CPU_MODEL), and the baseline was recorded on $BASELINE_CLASS. Results are not comparable across classes. Re-run this job; GitHub assigns runner hardware per job."
              exit 1
            fi
          fi

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: recall-eval-${{ matrix.engine }}

      - name: Install LLVM
        if: matrix.engine == 'rocksdb'
        run: |
          sudo apt-get update
          sudo apt-get install -y llvm-dev libclang-dev clang

      # The harness refuses the hash embedder, so the ONNX runtime and the arm's embedder are
      # fetched, pinned and SHA-256 verified by veld's own downloader. The key names the embedder,
      # so each arm restores a cache holding its own model.
      - uses: actions/cache@v4
        id: models
        with:
          path: ~/.cache/veld
          key: veld-models-${{ runner.os }}-${{ env.EMBEDDER }}-${{ hashFiles('src/embeddings/downloader.rs') }}
      - name: Fetch the ONNX runtime and the embedder
        if: steps.models.outputs.cache-hit != 'true'
        run: >-
          cargo run --release --quiet --bin model-fetch ${{ matrix.features }} -- --onnxruntime
          ${{ env.EMBEDDER == 'arctic-embed-xs' && '--arctic-xs' || env.EMBEDDER == 'nomic-embed-text-v1.5' && '--nomic' || '--minilm' }}

      # The cross-encoder downloads itself on first use; the models cache above is saved only on
      # a miss, so without this it would download every run, and a failed download in one repeat
      # makes the repeats diverge.
      - uses: actions/cache@v4
        with:
          path: ~/.cache/veld/cross-encoder
          key: veld-cross-encoder-${{ runner.os }}-${{ hashFiles('src/embeddings/cross_encoder.rs') }}

      - name: Build recall-eval
        run: cargo build --release --bin recall-eval ${{ matrix.features }}

      - name: Run the LoCoMo gate
        id: run
        env:
          # veld ships with neural NER off (VELD_NEURAL_NER defaults to false), so the rule-based
          # NER is the shipped system here; the harness's refusal of it is upstream's, which ships
          # GLiNER.
          SHODH_ALLOW_FALLBACK_NER: '1'
          # A second, 100-deep recall per case fills the per-case recall@50/@100 fields so a miss
          # can be read as rank-low (gold in 11..100) or never retrieved. The headline metrics come
          # from the production-depth query alone (src/recall_harness/runner.rs, diag_k).
          RECALL_DIAG_K: '100'
          # The reranker dials. Empty is unset: CognitiveDials::from_env keeps None for an
          # empty model id (sanitized away) and an unparsable count.
          VELD_DIALS_RERANK_MODEL: ${{ github.event.inputs.rerank_model || '' }}
          VELD_DIALS_RERANK_COUNT: ${{ github.event.inputs.rerank_count || '' }}
          VELD_DIALS_RERANK_POOL: ${{ github.event.inputs.rerank_pool || '' }}
          VELD_TUNE_CE_BLEND: ${{ github.event.inputs.ce_blend || '' }}
          VELD_DIALS_RELATIVE_PRIORS: ${{ github.event.inputs.relative_priors || '' }}
          VELD_DIALS_GRAPH_EPISODE_ENTITIES: ${{ github.event.inputs.graph_episode_entities || '' }}
          VELD_MODEL_TAPE_RECORD: ${{ env.MODEL_TAPE == 'record' && format('model-tape-{0}.jsonl.gz', matrix.engine) || '' }}
          VELD_MODEL_TAPE_REPLAY: ${{ env.TAPE_PATH }}
          VELD_STAGE_EXPORT: ${{ github.event.inputs.stage_export == 'on' && format('stages-{0}.jsonl', matrix.engine) || '' }}
          # minilm-l6-v2 is VELD_EMBEDDER=minilm, nomic-embed-text-v1.5 is VELD_EMBEDDER=nomic;
          # arctic-embed-xs is its own id.
          VELD_EMBEDDER: ${{ env.EMBEDDER == 'arctic-embed-xs' && 'arctic-embed-xs' || env.EMBEDDER == 'nomic-embed-text-v1.5' && 'nomic' || 'minilm' }}
        run: |
          set +e
          set -o pipefail
          gate_args=()
          if [ "$RECORD" != "true" ] && [ "$SUITE" = "locomo-gate" ]; then
            gate_args=(--baseline tests/recall/locomo-gate-baseline.json --tolerance "$TOLERANCE")
          fi
          ./target/release/recall-eval \
            --suite "$SUITE" \
            --layer "$LAYER" \
            --repeats "$REPEATS" \
            --output "current-${{ matrix.engine }}.json" \
            --per-case-output "per-case-${{ matrix.engine }}.json" \
            "${gate_args[@]}" \
            --storage ./recall-storage 2>&1 | tee "recall-eval-${{ matrix.engine }}.log"
          echo "exit_code=$?" >> "$GITHUB_OUTPUT"

      - name: Test the report scripts
        if: always()
        working-directory: scripts
        run: |
          python3 test_recall_diff.py
          python3 test_recall_engines_equal.py
          python3 test_stage_diff.py

      - name: Render the diff table
        if: always() && env.SUITE == 'locomo-gate' && hashFiles(format('current-{0}.json', matrix.engine)) != ''
        run: |
          # The per-case pair names the cases that moved; without it a red gate names a metric
          # but not the query that paid for it.
          python3 scripts/recall_diff.py tests/recall/locomo-gate-baseline.json \
            "current-${{ matrix.engine }}.json" --tolerance "$TOLERANCE" \
            --baseline-per-case tests/recall/locomo-gate-baseline.per-case.json \
            --current-per-case "per-case-${{ matrix.engine }}.json" > "recall-diff-${{ matrix.engine }}.md"
          cat "recall-diff-${{ matrix.engine }}.md" >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: recall-${{ matrix.engine }}
          path: |
            current-${{ matrix.engine }}.json
            per-case-${{ matrix.engine }}.json
            recall-eval-${{ matrix.engine }}.log
            recall-diff-${{ matrix.engine }}.md
            stages-${{ matrix.engine }}.jsonl
          if-no-files-found: warn
          retention-days: 30

      - name: Upload the model tape
        if: always() && env.MODEL_TAPE == 'record' && hashFiles(format('model-tape-{0}.jsonl.gz', matrix.engine)) != ''
        uses: actions/upload-artifact@v4
        with:
          name: model-tape-${{ matrix.engine }}
          path: model-tape-${{ matrix.engine }}.jsonl.gz
          if-no-files-found: error
          retention-days: 90

      # The early check and recall-eval derive the class separately, one from /proc/cpuinfo and one
      # from CPUID. If they disagree, the early check gates on a name recall-eval would not produce.
      - name: Check both kernel class derivations agree
        if: always() && env.RUNNER_CLASS != '' && hashFiles(format('current-{0}.json', matrix.engine)) != ''
        run: |
          REPORTED=$(jq -r '.kernel.class // ""' "current-${{ matrix.engine }}.json")
          if [ "$REPORTED" != "$RUNNER_CLASS" ]; then
            echo "::error::Kernel class derivations disagree: the workflow says $RUNNER_CLASS, recall-eval says $REPORTED. Keep the workflow's extras list in step with KERNEL_CLASS_EXTRAS."
            exit 1
          fi
          echo "Kernel class agrees: $REPORTED"

      # Absolute floors, which do not move when the baseline is re-recorded, on the gated run only.
      # They come from the retired recall-guard workflow, which needed a live server no hosted
      # runner had and so failed at its reachability check. Its p99 ceiling carries over as it
      # was (3,000 ms; the gate baseline's p99 is 1,147 ms). Its 0.60 multi_hop recall@10 floor
      # was measured on bench/recall_latency_guard.py's 20-memory corpus and does not transfer:
      # the gate baseline scores 0.406. The same derivation, known-good minus 10 points rounded
      # down, gives 0.30 here; the baseline comparison above already gates a 2% drop.
      - name: Enforce the absolute floors
        if: >-
          always() && steps.run.conclusion == 'success' && env.SUITE == 'locomo-gate' &&
          env.RECORD != 'true' && hashFiles(format('current-{0}.json', matrix.engine)) != ''
        env:
          MULTI_HOP_R10_FLOOR: '0.30'
          P99_LATENCY_CEILING_MS: '3000'
        run: |
          python3 - "current-${{ matrix.engine }}.json" <<'EOF'
          import json, os, sys
          report = json.load(open(sys.argv[1]))
          floor = float(os.environ["MULTI_HOP_R10_FLOOR"])
          ceiling = float(os.environ["P99_LATENCY_CEILING_MS"])
          r10 = report["by_category"]["multi_hop"]["recall@10"]
          p99 = report["layers"]["full"]["latency_p99_ms"]
          print(f"multi_hop recall@10 {r10:.4f} (floor {floor}), p99 {p99:.0f} ms (ceiling {ceiling:.0f})")
          failed = False
          if r10 < floor:
              print(f"::error::multi_hop recall@10 {r10:.4f} is under the {floor} floor")
              failed = True
          if p99 > ceiling:
              print(f"::error::recall p99 {p99:.0f} ms is over the {ceiling:.0f} ms ceiling")
              failed = True
          sys.exit(1 if failed else 0)
          EOF

      # Only when the eval step completed: after a timeout or an earlier failure the job is already
      # red for the right reason, and an empty exit code here would add a misleading second error.
      - name: Enforce the gate
        if: always() && steps.run.conclusion == 'success'
        env:
          EXIT: ${{ steps.run.outputs.exit_code }}
        run: |
          case "$EXIT" in
            0) echo "::notice::recall gate passed (${{ matrix.engine }}, record=$RECORD)" ;;
            1) echo "::error::recall regression beyond ${TOLERANCE}% on ${{ matrix.engine }}"; exit 1 ;;
            2) echo "::error::recall harness infrastructure failure on ${{ matrix.engine }}"; exit 1 ;;
            *) echo "::error::recall-eval exited with '$EXIT' on ${{ matrix.engine }}"; exit 1 ;;
          esac

  engines-equal:
    name: Engines score equal
    needs: gate
    if: always() && needs.gate.result != 'cancelled'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: recall-*
          merge-multiple: true
      - name: Compare the RocksDB and redb reports
        run: python3 scripts/recall_engines_equal.py current-rocksdb.json current-redb.json
