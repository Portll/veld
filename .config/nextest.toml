# cargo-nextest runs each test in its own process, across every test binary at once. CI ran the
# 66 binaries one after another under `cargo test`, and five of them held two thirds of the
# 23 minutes (2026-10-21).

[profile.ci]
fail-fast = false
failure-output = "immediate-final"
# No test binary on CI ran longer than 306 s, so no single test did; fifteen minutes is a hang.
slow-timeout = { period = "60s", terminate-after = 15 }

# The engine-parity binary replays the LoCoMo gate on both engines in single tests: one took
# 649 s on CI (2026-10-22), close enough to fifteen minutes that a loaded runner would kill it.
[[profile.ci.overrides]]
filter = 'binary(recall_engine_parity)'
slow-timeout = { period = "120s", terminate-after = 15 }

# Pull requests that do not touch recall, storage, embeddings or vector code skip the tests that
# take over 100 s each on CI (2026-10-22): together they held the both-engines job at 38 min. Main,
# the nightly run and any pull request touching those paths run them under `ci`.
[profile.ci-pr]
fail-fast = false
failure-output = "immediate-final"
slow-timeout = { period = "60s", terminate-after = 15 }
default-filter = """
not (
    binary(recall_engine_parity)
    | test(=recall_harness::forgetting_harness::planted_tests::repetition_from_one_source_does_not_move_a_planted_memory_but_corroboration_does)
    | test(=recall_harness::runner::tests::runner_executes_smoke_suite_and_produces_well_formed_report)
    | test(=storage::differential_tests::primary_memory_store_engines_agree_after_every_step)
    | (binary(integration_tests) & test(=test_stress_scenarios))
    | (binary(bug_regression_tests) & test(=test_bug007_combined_search_scales_linearly))
)
"""
