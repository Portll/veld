# =============================================================================
# GATED TEST TARGETS
# =============================================================================
# Heavy stress suites are excluded from the default `cargo test` build via
# `required-features`. They are slow and intentionally push the system past
# its limits, so they only build/run under `cargo test --features stress`.
[[test]]
name = "brutal_stress_tests"
path = "tests/brutal_stress_tests.rs"
required-features = ["stress"]

# =============================================================================
# CARGO-BINSTALL — pre-built binary installation
# =============================================================================
# Users install with: cargo binstall veld
# Falls back to cargo install if no pre-built binary matches.
[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/v{ version }/{ name }-{ target }{ archive-suffix }"
bin-dir = "{ bin }{ binary-ext }"
pkg-fmt = "bin"

[package.metadata.binstall.overrides.x86_64-pc-windows-msvc]
pkg-url = "{ repo }/releases/download/v{ version }/veld-x86_64-windows.exe"

[package.metadata.binstall.overrides.aarch64-apple-darwin]
pkg-url = "{ repo }/releases/download/v{ version }/veld-aarch64-macos"

[package.metadata.binstall.overrides.x86_64-apple-darwin]
pkg-url = "{ repo }/releases/download/v{ version }/veld-x86_64-macos"

[package.metadata.binstall.overrides.x86_64-unknown-linux-gnu]
pkg-url = "{ repo }/releases/download/v{ version }/veld-x86_64-linux"

# Dependencies are never stepped through, so they carry no debug info; the workspace keeps line
# tables, which is all a backtrace or a failing test needs to name a file and line. Cargo's
# default (full debug info for every crate) multiplies the size of target/. A session that needs
# a debugger builds with `--profile dev-debug`.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

# Stated, not inherited, so an edit to [profile.dev] does not silently change what tests emit.
[profile.test]
debug = "line-tables-only"

[profile.test.package."*"]
debug = false

[profile.dev-debug]
inherits = "dev"
debug = true

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true  # Reduce binary size
# No `panic = "abort"` while [lib] builds a cdylib. A cdylib lib is emitted under one unhashed
# filename, and abort makes cargo build the lib twice whenever a test harness is in the graph
# (harnesses need unwind): both variants write the same rlib, one clobbers the other, and the
# consumer links against the wrong one (rust-lang/cargo#6313), so `cargo test --release` cannot
# build. Unwinding also keeps a panicking request on its own task: tokio turns it into a
# JoinError instead of the panic ending the server.

[profile.bench]
# Inherits release.
opt-level = 3
lto = "thin"  # Faster build than full LTO for benchmarks

# =============================================================================
# FORTRESS PROFILE — Fractal obfuscation for distribution binaries
# =============================================================================
# Build: cargo build --profile fortress --features fortress
# Result: stripped, monomorphized, no debug, no unwind, no readable strings
[profile.fortress]
inherits = "release"
opt-level = 3           # Maximum optimization (destroys source structure)
lto = "fat"             # Full cross-crate LTO (monomorphizes everything)
codegen-units = 1       # Single codegen unit (LLVM sees entire program)
strip = "symbols"       # Strip symbol table + debug info
panic = "abort"         # Remove unwind tables (huge source of reverse info)
overflow-checks = false # Remove overflow check branches (dead code elimination)
debug = 0               # Zero debug info
debug-assertions = false
incremental = false     # Full rebuild every time (no incremental artifacts)

[features]
# The default build carries both engines; RocksDB is the default engine (ADR 0007).
default = ["rocksdb", "storage-redb"]

# The RocksDB engine and what only it provides today: the RocksDB backup engine and the
# `MemoryStorage` in src/memory/storage.rs. Needs libclang and a C++ toolchain. A build
# without it refuses those paths and names this feature:
# `--no-default-features --features storage-redb` is the redb-only build.
rocksdb = ["dep:rocksdb"]

# The earlier name of `rocksdb`, kept so existing build commands keep working.
legacy-rocksdb = ["rocksdb"]

# The redb storage engine.
storage-redb = ["dep:redb"]

# Heavy stress / brute-force test suites. Off by default so the standard
# test build stays fast and does not compile the aggressive suites. Enable
# with `cargo test --features stress` (gates tests/brutal_stress_tests.rs).
stress = []

# Postgres / Supabase relational backend (W4). Opt-in: enabling it pulls the
# `sqlx-postgres` driver tree (~12 small pure-Rust crates — sqlx-postgres +
# SCRAM-auth + config helpers; no C/native deps). Off by default so the
# standard build stays SQLite-only and byte-for-byte unchanged.
postgres = ["sqlx/postgres"]

# Microsoft SQL Server backend (W4-D). Opt-in: tiberius pulls a heavy TDS
# protocol stack (its own wire codec, TLS, auth). Off by default so the
# standard build stays SQLite-only.
mssql = ["dep:tiberius", "tokio-util/compat"]

# Python bindings for PyO3
python = ["pyo3", "numpy"]

# Optional: LLM-based query parser (future: requires API key)
llm-parser = []

# Optional: hosaka multi-tenant collective learning and auth binding.
multi-tenant = []

# Optional: Zenoh transport for robotics/ROS2 (pure Rust, cross-platform)
zenoh = ["dep:zenoh"]

# Optional: PDF text extraction for ingest and seed_project
pdf = ["dep:pdf-extract"]

# Fortress: fractal binary obfuscation for distribution
# Eliminates ALL tracing, replaces error messages with codes,
# custom panic handler, anti-debug, integrity checks.
fortress = []

# Embed the mdBook output (`docs/book/`) into the veld binary so the standalone
# distribution carries the docs without needing the repo on disk. Adds ~3-5 MB
# to the release binary. Required by CI when producing release artifacts.
embedded-docs = ["dep:rust-embed"]

# Optional: Distributed tracing for cloud/multi-node deployments (~200 extra packages)
telemetry = [
    "tracing-opentelemetry",
    "opentelemetry",
    "opentelemetry-otlp",
    "opentelemetry_sdk"
]


# Optional: built only with `rocksdb`.
# jemalloc replaces the system C allocator inside RocksDB's C++ code (not just Rust).
# Without it, glibc/CRT malloc fragments heavily and never returns memory to the OS.
# Confirmed fix by rust-rocksdb maintainer (zaidoon1) in facebook/rocksdb#12364.
# PRs #989 (ran-openai) and #1026 (timothyg-stripe) fixed jemalloc linking in v0.24.0.
[target.'cfg(not(windows))'.dependencies]
rocksdb = { version = "0.24", default-features = false, features = ["lz4", "jemalloc"], optional = true }

# jemalloc doesn't compile with MSVC — Windows uses default CRT allocator.
# Fundamental fix requires facebook/rocksdb#14403 (custom allocator C API for mimalloc).
[target.'cfg(windows)'.dependencies]
rocksdb = { version = "0.24", default-features = false, features = ["lz4"], optional = true }

[workspace]
# Standalone workspace - not part of parent kalki-v2
# status-core keeps its own workspace and lockfile, as the monitor and the status
# TUI and widget that also depend on it do; a path dependency inside this directory
# would otherwise be drawn in as a member.
exclude = ["status-core"]
