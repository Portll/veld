[package]
name = "veld"
version = "0.8.4"
edition = "2021"
authors = ["Portll <john@portll.net>"]
description = "Persistent cognitive memory for AI agents and robots — Hebbian learning, knowledge graph, spatial recall. Zenoh/ROS2 native. Single binary, runs offline."
license = "LicenseRef-Veld-Evaluation-1.0"
repository = "https://github.com/portll/veld"
homepage = "https://github.com/portll/veld"
readme = "README-rust.md"
# crates.io allows five. Chosen for what someone would actually TYPE to find this,
# not for what it is called internally. Counts below are crates CARRYING the keyword
# (crates.io /api/v1/keywords), measured 2026-08-22 — that is adoption of the term,
# not search volume, which is not published.
#
# Dropped over two passes: "ai" (4.6k crates carry "llm" alone — a term that generic
# discriminates nothing), "cognitive" (unused vocabulary), "zenoh" (the transport, not
# the ecosystem), "agents" (1573), "robotics" (769), "vector-database" (100 — the
# weakest of the set it was in; "vector-search" says the same thing with twice the
# adoption).
#
# memory 1466 · vector-search 208 · knowledge-graph 380 · rag 441 · semantic-search 160
#
# "database" (3978) held this slot briefly and gave it up: it is the most crowded term of the
# set AND veld already occupies the `database` CATEGORY below, so the keyword bought a facet
# it was not adding. "knowledge-graph" is absent from crates.io's category taxonomy — checked
# against the live API, both spellings return NOT A CATEGORY — so a keyword slot is the only
# place it can live, and it names something veld actually does.
#
# The fuller fifteen-term set lives in pyproject.toml, which has no five-keyword limit.
keywords = ["memory", "vector-search", "knowledge-graph", "rag", "semantic-search"]
# "embedded" (6626) described where veld can RUN, not what it is; it also duplicated a claim
# the keywords no longer make. "database-implementations" (1494) is crates.io's term for a
# database you run rather than an interface you call, which is what this is. Categories are a
# FIXED taxonomy — unlike keywords, an invented one makes `cargo publish` reject the crate.
categories = ["science", "database", "database-implementations"]
exclude = [
    "mcp-server/",
    "python/",
    "docker/",
    "test_memory_db/",
    "veld_data/",
    "*.exe",
    "*.tar.gz",
    "*.dll",
    "*.zip",
    "*.whl",
    "*.pdf",
    "*.odt",
    "*.html",
    "!src/handlers/graph_view.html",
    "*.py",
    "*.log",
    "*.json",
    "!Cargo.lock",
    "job_log.txt",
    "macos_log.txt",
    "full_log.txt",
    "hook_*.txt",
    ".mcp.json",
    "nul",
    "install_bun.ps1",
    ".venv/",
    ".claude/",
    "assets/",
    "benchmarks/",
    "benchmark_report.json",
    "bugs-remedies/",
    "docker-compose.yml",
    "Dockerfile",
    "examples/",
    "hooks/",
    "marketing/",
    "notebooks/",
    "release-test/",
    "seps/",
    "skills/",
    "test_*/",
    "*.md",
    "!README-rust.md",
    "openapi.yaml",
    "veld_logo_nobackground.png",
    "veld_config.example.json",
    "STPI_PITCH_DECK.md",
    ".github/",
    "pyproject.toml",
    "C*facts_out.json",
    "tui/",
    "veld-telegram/",
    "veld-todoist/",
    "veld-whatsapp/",
    "signature.JPG",
    "start_server.bat",
    "*.ts",
    "*.patch",
    "*.diff",
    "*.png",
    "!src/**",
    "scripts/",
    "clippy_output.txt",
    "C*clippy_out.txt",
    ".smithery/",
    "drafts/",
]

[lib]
name = "veld"
path = "src/lib.rs"
# rlib: for Rust library usage (tests, benchmarks, binary)
# cdylib: for Python bindings (PyO3/maturin needs shared library)
# The cdylib gives this lib an unhashed filename, which is why [profile.release] must not set
# `panic`: see the note there.
crate-type = ["rlib", "cdylib"]

[[bin]]
name = "veld"
path = "src/cli.rs"

[[bin]]
name = "alignment-collect"
path = "src/bin/alignment_collect.rs"

[[bin]]
name = "alignment-fit"
path = "src/bin/alignment_fit.rs"

[[bin]]
name = "alignment-eval"
path = "src/bin/alignment_eval.rs"

[[bin]]
name = "veld-keyctl"
path = "src/bin/veld_keyctl.rs"

[[bin]]
name = "graph-sweep"
path = "src/bin/graph_sweep.rs"

[[bin]]
name = "chunk-audit"
path = "src/bin/chunk_audit.rs"

[[bin]]
name = "model-fetch"
path = "src/bin/model_fetch.rs"

[[bin]]
name = "llm-eval"
path = "src/bin/llm_eval.rs"

[[bin]]
name = "recall-eval"
path = "src/bin/recall_eval.rs"

[dependencies]
# MCP Protocol
rmcp = { version = "2.2", features = ["server", "macros", "transport-io"] }
clap = { version = "4.5", features = ["derive", "env"] }
# Global allocator — replaces Windows default heap (eliminates segment doubling / commit bloat)
mimalloc = "0.1"

# Core
anyhow = "1.0"
libc = "0.2"
async-trait = "0.1"  # Object-safe async trait sugar (W4 RelationalStore, W6 query planner, W7 DatasetStore)
thiserror = "2.0"
dotenvy = "0.15"  # Load .env files
toml = { version = "0.8", default-features = false, features = ["parse"] }  # Parse veld init's config.toml
veld-status-core = { path = "status-core" }  # `veld restart`: the monitor's restart path, shared

# Async runtime & web server
tokio = { version = "1.48", features = ["full"] }
tokio-stream = { version = "0.1", features = ["sync"] }  # SSE event streaming (sync for BroadcastStream)
tokio-util = { version = "0.7", features = ["rt"] }  # TaskTracker: shutdown waits for background writes
futures = "0.3"  # Stream utilities for SSE
axum = { version = "0.8", features = ["json", "ws"] }
tower = { version = "0.5", features = ["limit", "buffer", "load-shed"] }
tower-http = { version = "0.6", features = ["cors", "fs", "timeout"] }

# Optional: compile-time docs embedding for self-contained release binaries.
# Off by default — dev builds stay lean and use the filesystem at docs/book/.
# Enable with `--features embedded-docs` for release/install artifacts so a
# fresh `cargo install veld` carries the full sidecar without needing the
# repo checkout. In debug builds the macro reads from the filesystem at
# request time anyway, so iteration is unaffected.
rust-embed = { version = "8", optional = true, features = ["mime-guess"] }
tower_governor = { version = "0.8", features = ["axum"] }
governor = "0.10"  # Direct GCRA limiter handle (used by ResettableRateLimit for admin-reset support)
subtle = "2.6"  # Constant-time equality for admin API key compare

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
form_urlencoded = "1"

# Storage
bincode = { version = "2", features = ["serde"] }
bincode1 = { package = "bincode", version = "1.3" }  # Legacy format support for pre-2.0 memories
rmp-serde = "1.3"  # MessagePack - binary format that supports serde tagged enums
lz4 = "1.28"
redb = { version = "2", optional = true }
rusqlite = { version = "0.32", features = ["bundled"] }  # SQLite slow store for gap topology queries (WAL mode)
# W4 foundation — backend-agnostic relational executor (SQLite today, Postgres/Supabase next).
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio-rustls", "sqlite"] }
# W4 MSSQL backend (optional, heavy — gated behind the `mssql` feature).
# tiberius is the de-facto MSSQL Rust client (sqlx has no maintained MSSQL
# driver); it ships its own TDS protocol stack. tokio-util/compat adapts a
# tokio TcpStream into the futures AsyncRead/Write tiberius expects.
tiberius = { version = "0.12", optional = true }

# Concurrency
parking_lot = "0.12"
dashmap = "6.1"
moka = { version = "0.12", features = ["sync"] }  # Lock-free concurrent cache with LRU eviction
once_cell = "1.20"  # Per-process caches (e.g. AgentSession detection)

# Process / system introspection — minimal feature set (no networking / components).
# `system` for memory::session_detect (parent process to chat-brand id); `disk`
# for storage::write_latch, which must know whether a store's filesystem has
# space before retrying a write RocksDB refused for want of it.
sysinfo = { version = "0.32", default-features = false, features = ["system", "disk"] }

# Utilities
uuid = { version = "1.19", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
lru = "0.16.3"
regex = "1.12"
rust-stemmers = "1.2"  # Porter2 stemming for linguistic analysis
dirs = "6.0"  # Platform-specific directory paths
dateparser = "0.2"  # Safe natural language date parsing (returns Result, no panic)
glob = "0.3"  # Pattern matching for file paths
yake-rust = "1.0"  # Statistical keyword extraction (position, frequency, capitalization)

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Observability (P1.1)
prometheus = "0.14"

# Distributed Tracing (P1.6) - OPTIONAL (heavy, ~200 packages, not needed for edge)
# NOTE: tracing-opentelemetry 0.33 requires opentelemetry 0.32. opentelemetry_sdk
# 0.32.1 is the floor (GHSA-w9wp-h8wv-79jx). The otlp exporter keeps only gRPC
# (tonic): its 0.32 defaults switched to HTTP with a blocking reqwest client.
tracing-opentelemetry = { version = "0.33", optional = true }
opentelemetry = { version = "0.32", features = ["trace"], optional = true }
opentelemetry-otlp = { version = "0.32", default-features = false, features = ["trace", "grpc-tonic", "internal-logs"], optional = true }
opentelemetry_sdk = { version = "0.32.1", features = ["trace"], optional = true }

# FFT for spectral analysis of access patterns (learned decay scales)
rustfft = "6"

# Vector operations (lightweight)
ordered-float = "5.0"

# Linear algebra for embedding alignment (SVD, ridge regression)
nalgebra = { version = "0.33", default-features = false, features = ["std", "matrixmultiply"] }

# Parallel iterators (alignment fit/eval batch encoding)
rayon = "1.10"

# Filesystem walker for alignment corpus assembly
walkdir = "2"

# Vector database (Vamana HNSW)
memmap2 = "0.9"
rand = "0.8"

# ONNX Runtime for embeddings (MiniLM-L6-v2)
# Using load-dynamic for runtime DLL loading (bundled in wheels)
# CRT conflicts solved via .cargo/config.toml: -crt-static
ort = { version = "2.0.0-rc.11", default-features = false, features = ["load-dynamic", "half"] }
tokenizers = { version = "0.21", default-features = false, features = ["onig"] }
ndarray = "0.16"

# Graph visualization
petgraph = "0.8"

# Full-text search (BM25)
tantivy = "0.25"

# Bloom filter
bloomfilter = "3.0"

# Base64 encoding
base64 = "0.22"

# Backup & Restore (P2) + Model checksum verification (P1)
sha2 = "0.10"
hex = "0.4"

# Intent log frame checksums (W5 — log-structured projection layer)
crc32fast = "1.4"

# Live wiki edit-back watcher (optional layer; default-off via VELD_WIKI_WATCH)
notify = "6"

# MIF encryption (AES-256-GCM)
aes-gcm = "0.10"
# XChaCha20-Poly1305 for record encryption: 192-bit random nonce removes the
# AES-GCM ~2^32 random-nonce ceiling for the high-volume record path.
chacha20poly1305 = "0.10"
zeroize = { version = "1", features = ["derive"] }

# User auth (Phase C) — Argon2id password + recovery code hashing and RFC 6238 TOTP.
# `argon2` provides parameterised Argon2id and constant-time verification using `subtle`.
# `totp-rs` 5.x pins SHA-1 by default (RFC 6238 baseline) and supports
# `otpauth://` provisioning URIs without pulling in QR/serde extras.
argon2 = "0.5"
totp-rs = { version = "5.6", default-features = false, features = ["otpauth"] }

# External integrations (SHO-40)
hmac = "0.12"
reqwest = { version = "0.12", default-features = false, features = ["json", "blocking", "rustls-tls"] }

# Auto-download for models and ONNX runtime
ureq = { version = "3.0", features = ["json"] }
zip = { version = "7.0", default-features = false, features = ["deflate"] }
flate2 = "1.1"
tar = "0.4"

# Python bindings (optional)
# NOTE: pyo3 >= 0.29 required for RUSTSEC-2026-0176 (OOB read in PyList/PyTuple
# iterators) and RUSTSEC-2026-0177 (missing Sync bound on new_closure);
# >= 0.24.1 was required for RUSTSEC-2025-0020 (buffer overflow fix)
pyo3 = { version = "0.29", features = ["extension-module", "abi3-py38"], optional = true }
numpy = { version = "0.29", optional = true }

# PDF text extraction (optional — pulls in lopdf + unicode-normalization)
pdf-extract = { version = "0.12", optional = true }

# Zenoh transport for robotics (optional — pure Rust, zero C deps)
# Enables pub/sub + request/reply integration with ROS2 via rmw_zenoh or zenoh-bridge-ros2dds
zenoh = { version = "1.1", default-features = false, features = ["transport_tcp", "transport_udp"], optional = true }

# LLM-based query parsing (optional - heavy dependency)

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }
http-body-util = "0.1"
proptest = "1"
serde-reflection = "0.6.0"
tempfile = "3.24"

