[package]
name = "veld-manager"
version = "0.1.0"
edition = "2021"
authors = ["Portll <john@portll.net>"]
description = "Veld Manager — desktop console for workspaces, folders, repos, GitHub accounts, and Veld tenant scopes"
license = "BUSL-1.1"

[[bin]]
name = "veld-manager"
path = "src/main.rs"

[lib]
name = "veld_manager_lib"
path = "src/lib.rs"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }

tokio = { version = "1", features = ["macros", "rt", "rt-multi-thread", "sync", "time"] }
parking_lot = "0.12"

serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }

anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
zeroize = { version = "1", features = ["derive"] }
url = "2"

# HTTP client to the Veld API (health now; admin + recall in later phases).
# rustls (no OpenSSL) to keep the build self-contained on macOS.
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
# md5 of the (path + "\n") the Claude Code hooks hash via `echo "$dir" | md5`,
# so the Manager's project_hash matches CLAUDE_PROJECT_HASH exactly.
md5 = "0.7"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true

# Standalone workspace — detaches from the parent veld Cargo.toml so `cargo`
# does not fold this app into the veld package's workspace.
[workspace]
